<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse Messenger</title>
    <script src="https://cdn.jsdelivr.net/npm/dexie@3/dist/dexie.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            overflow: hidden;
        }

        /* Формы входа и регистрации */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .auth-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 400px;
        }

        .auth-box h2 {
            margin-bottom: 30px;
            color: #333;
            text-align: center;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        /* Кнопка показать/скрыть пароль */
        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #666;
            padding: 5px;
            line-height: 1;
        }

        .password-toggle:hover {
            color: #333;
        }

        .input-group input[type="password"],
        .input-group input[type="text"].password-input {
            padding-right: 45px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: transparent;
            color: #667eea;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: #f0f2f5;
        }

        /* Интерфейс чата */
        .chat-container {
            display: none;
            height: 100vh;
            flex-direction: row;
        }

        .chat-container.active {
            display: flex;
        }

        /* Боковая панель */
        .sidebar {
            width: 320px;
            background: white;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h3 {
            color: #333;
        }

        .logout-btn {
            padding: 8px 16px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .logout-btn:hover {
            background: #ee5a6f;
        }

        .search-box {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            font-size: 14px;
        }

        .dialogs-list {
            flex: 1;
            overflow-y: auto;
        }

        .dialog-item {
            padding: 15px 20px;
            border-bottom: 1px solid #f0f2f5;
            cursor: pointer;
            transition: background 0.2s;
        }

        .dialog-item:hover {
            background: #f8f9fa;
        }

        .dialog-item.active {
            background: #e3f2fd;
        }

        .dialog-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        .dialog-last-message {
            font-size: 13px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Область чата */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f0f2f5;
        }

        .empty-chat {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #999;
            font-size: 18px;
        }

        .chat-header {
            background: white;
            padding: 15px 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h4 {
            color: #333;
            font-size: 18px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .chat-header h4:hover {
            color: #667eea;
        }

        /* Кнопка удалить чат */
        .delete-chat-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            transition: background 0.2s;
        }

        .delete-chat-btn:hover {
            background: #ee5a6f;
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .message.sent {
            align-items: flex-end;
        }

        .message.received {
            align-items: flex-start;
        }

        .message-bubble {
            max-width: 60%;
            padding: 10px 15px;
            border-radius: 12px;
            word-wrap: break-word;
        }

        .message.sent .message-bubble {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.received .message-bubble {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
        }

        .input-area {
            background: white;
            padding: 15px 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            font-size: 14px;
        }

        .input-area button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
        }

        .input-area button:hover {
            background: #5568d3;
        }

        .hidden {
            display: none;
        }

        /* Кнопка профиля */
        .profile-btn {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-left: 10px;
        }

        .profile-btn:hover {
            background: #5568d3;
        }

        /* Модальное окно профиля */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 20px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: white;
        }

        .profile-banner-container {
            position: relative;
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px 12px 0 0;
            overflow: hidden;
        }

        .profile-banner,
        .preview-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .change-banner-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 5;
        }

        .profile-banner-container:hover .change-banner-btn {
            opacity: 1;
        }

        .profile-avatar-container {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid white;
            margin: -60px auto 0;
            background: #e0e0e0;
            overflow: hidden;
            cursor: pointer;
        }

        .profile-avatar,
        .preview-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .change-avatar-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
            color: white;
            font-size: 14px;
        }

        .profile-avatar-container:hover .change-avatar-overlay {
            opacity: 1;
        }

        .profile-info {
            padding: 20px;
            text-align: center;
        }

        .profile-username {
            font-size: 24px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
        }

        .profile-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .settings-btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .settings-btn:hover {
            background: #5568d3;
        }

        /* Модальное окно настроек */
        .settings-modal .modal-content {
            width: 600px;
        }

        .settings-header {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        .settings-header h3 {
            font-size: 20px;
            color: #333;
        }

        .settings-body {
            padding: 20px;
        }

        .settings-section {
            margin-bottom: 30px;
        }

        .settings-section h4 {
            font-size: 16px;
            color: #333;
            margin-bottom: 15px;
        }

        .position-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .position-control {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .position-control label {
            font-size: 14px;
            color: #666;
            display: flex;
            justify-content: space-between;
        }

        .position-control input[type="range"] {
            width: 100%;
        }

        .preview-container {
            margin-top: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
        }

        .preview-banner {
            width: 100%;
            height: 120px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            overflow: hidden;
        }

        .preview-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid white;
            margin: -40px auto 20px;
            background: #e0e0e0;
            overflow: hidden;
        }

        .preview-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .settings-footer {
            padding: 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-cancel {
            padding: 10px 20px;
            background: #e0e0e0;
            color: #333;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-cancel:hover {
            background: #d0d0d0;
        }

        .btn-save {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-save:hover {
            background: #5568d3;
        }

        /* Скрытые инпуты для файлов */
        .file-input-hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Экран входа -->
    <div id="loginScreen" class="auth-container">
        <div class="auth-box">
            <h2>Вход в Pulse</h2>
            <form id="loginForm">
                <div class="input-group">
                    <input type="text" id="loginUsername" placeholder="Имя пользователя" required>
                </div>
                <div class="input-group">
                    <div class="password-wrapper">
                        <input type="password" id="loginPassword" class="password-input" placeholder="Пароль" required>
                        <button type="button" class="password-toggle" onclick="togglePassword('loginPassword')">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Войти</button>
                <button type="button" class="btn btn-secondary" onclick="showRegister()">Регистрация</button>
            </form>
        </div>
    </div>

    <!-- Экран регистрации -->
    <div id="registerScreen" class="auth-container hidden">
        <div class="auth-box">
            <h2>Регистрация</h2>
            <form id="registerForm">
                <div class="input-group">
                    <input type="text" id="registerUsername" placeholder="Имя пользователя" required>
                </div>
                <div class="input-group">
                    <div class="password-wrapper">
                        <input type="password" id="registerPassword" class="password-input" placeholder="Пароль" required>
                        <button type="button" class="password-toggle" onclick="togglePassword('registerPassword')">👁️</button>
                    </div>
                </div>
                <div class="input-group">
                    <div class="password-wrapper">
                        <input type="password" id="registerPasswordConfirm" class="password-input" placeholder="Повторите пароль" required>
                        <button type="button" class="password-toggle" onclick="togglePassword('registerPasswordConfirm')">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
                <button type="button" class="btn btn-secondary" onclick="showLogin()">Уже есть аккаунт</button>
            </form>
        </div>
    </div>

    <!-- Интерфейс чата -->
    <div id="chatScreen" class="chat-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h3 id="currentUserName">Пользователь</h3>
                <div>
                    <button class="profile-btn" onclick="openMyProfile()">Профиль</button>
                    <button class="logout-btn" onclick="logout()">Выйти</button>
                </div>
            </div>
            <div class="search-box">
                <input type="text" id="searchUsers" placeholder="Поиск пользователей..." onkeyup="searchUsers()">
            </div>
            <div class="dialogs-list" id="dialogsList"></div>
        </div>

        <div class="chat-area">
            <div class="empty-chat" id="emptyChat">
                Выберите диалог для начала общения
            </div>
            <div id="activeChat" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
                <div class="chat-header">
                    <h4 id="activeChatName" onclick="openActiveUserProfile()" title="Посмотреть профиль">Имя собеседника</h4>
                    <button class="delete-chat-btn" onclick="deleteChat()" title="Удалить чат">🗑️</button>
                </div>
                <div class="messages-area" id="messagesArea"></div>
                <div class="input-area">
                    <input type="text" id="messageInput" placeholder="Введите сообщение..." onkeypress="handleMessageKeyPress(event)">
                    <button onclick="sendMessage()">Отправить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно профиля -->
    <div id="profileModal" class="modal-overlay" onclick="closeModalOnOverlay(event, 'profileModal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeProfileModal()">✕</button>
            <div class="profile-banner-container">
                <img id="profileBanner" class="profile-banner" style="display: none;">
                <button class="change-banner-btn" id="changeBannerBtn" onclick="selectBanner()" style="display: none;">
                    📷 Изменить фон
                </button>
            </div>
            <div class="profile-avatar-container" id="avatarContainer">
                <img id="profileAvatar" class="profile-avatar" style="display: none;">
                <div class="change-avatar-overlay" id="changeAvatarOverlay" style="display: none;">
                    📷 Изменить
                </div>
            </div>
            <div class="profile-info">
                <div class="profile-username" id="profileUsername">Имя пользователя</div>
                <div class="profile-actions" id="profileActions">
                    <button class="settings-btn" onclick="openSettings()">⚙️ Настройки</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно настроек -->
    <div id="settingsModal" class="modal-overlay settings-modal" onclick="closeModalOnOverlay(event, 'settingsModal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeSettingsModal()">✕</button>
            <div class="settings-header">
                <h3>⚙️ Настройки профиля</h3>
            </div>
            <div class="settings-body">
                <div class="settings-section">
                    <h4>Расположение фона профиля</h4>
                    <div class="position-controls">
                        <div class="position-control">
                            <label>
                                <span>Горизонталь (X)</span>
                                <span id="bannerXValue">50%</span>
                            </label>
                            <input type="range" id="bannerXSlider" min="0" max="100" value="50" oninput="updateBannerPosition()">
                        </div>
                        <div class="position-control">
                            <label>
                                <span>Вертикаль (Y)</span>
                                <span id="bannerYValue">50%</span>
                            </label>
                            <input type="range" id="bannerYSlider" min="0" max="100" value="50" oninput="updateBannerPosition()">
                        </div>
                    </div>
                </div>

                <div class="settings-section">
                    <h4>Расположение фото профиля</h4>
                    <div class="position-controls">
                        <div class="position-control">
                            <label>
                                <span>Горизонталь (X)</span>
                                <span id="avatarXValue">50%</span>
                            </label>
                            <input type="range" id="avatarXSlider" min="0" max="100" value="50" oninput="updateAvatarPosition()">
                        </div>
                        <div class="position-control">
                            <label>
                                <span>Вертикаль (Y)</span>
                                <span id="avatarYValue">50%</span>
                            </label>
                            <input type="range" id="avatarYSlider" min="0" max="100" value="50" oninput="updateAvatarPosition()">
                        </div>
                    </div>
                </div>

                <div class="settings-section">
                    <h4>Предпросмотр</h4>
                    <div class="preview-container">
                        <div class="preview-banner">
                            <img id="previewBanner" style="display: none;">
                        </div>
                        <div class="preview-avatar">
                            <img id="previewAvatar" style="display: none;">
                        </div>
                    </div>
                </div>
            </div>
            <div class="settings-footer">
                <button class="btn-cancel" onclick="closeSettingsModal()">Отмена</button>
                <button class="btn-save" onclick="saveSettings()">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Скрытые инпуты для загрузки файлов -->
    <input type="file" id="avatarInput" class="file-input-hidden" accept="image/*" onchange="handleAvatarChange(event)">
    <input type="file" id="bannerInput" class="file-input-hidden" accept="image/*" onchange="handleBannerChange(event)">

    <script>
        // Инициализация базы данных
        const db = new Dexie('PulseMessenger');
        db.version(2).stores({
            users: '++id, username, password',
            messages: '++id, fromUser, toUser, text, timestamp',
            profiles: 'username, avatar, banner, avatar_pos, banner_pos'
        });

        let currentUser = null;
        let activeDialog = null;
        let currentProfileUser = null;
        let tempAvatar = null;
        let tempBanner = null;
        let tempAvatarPos = '50% 50%';
        let tempBannerPos = '50% 50%';

        // Функция переключения видимости пароля
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const button = input.nextElementSibling;

            if (input.type === 'password') {
                input.type = 'text';
                button.textContent = '🙈';
            } else {
                input.type = 'password';
                button.textContent = '👁️';
            }
        }

        // Показать экран регистрации
        function showRegister() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('registerScreen').classList.remove('hidden');
        }

        // Показать экран входа
        function showLogin() {
            document.getElementById('registerScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
        }

        // Регистрация
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('registerUsername').value.trim();
            const password = document.getElementById('registerPassword').value;
            const passwordConfirm = document.getElementById('registerPasswordConfirm').value;

            if (password !== passwordConfirm) {
                alert('Пароли не совпадают!');
                return;
            }

            const existingUser = await db.users.where('username').equals(username).first();
            if (existingUser) {
                alert('Пользователь с таким именем уже существует!');
                return;
            }

            await db.users.add({ username, password });
            alert('Регистрация успешна! Теперь войдите в систему.');
            showLogin();
            document.getElementById('registerForm').reset();
        });

        // Вход
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            const user = await db.users.where('username').equals(username).first();

            if (!user || user.password !== password) {
                alert('Неверное имя пользователя или пароль!');
                return;
            }

            currentUser = user;
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('chatScreen').classList.add('active');
            document.getElementById('currentUserName').textContent = user.username;
            document.getElementById('loginForm').reset();

            await loadDialogs();
        });

        // Выход
        function logout() {
            currentUser = null;
            activeDialog = null;
            document.getElementById('chatScreen').classList.remove('active');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('activeChat').classList.add('hidden');
            document.getElementById('emptyChat').style.display = 'flex';
        }

        // Загрузка списка диалогов
        async function loadDialogs() {
            const messages = await db.messages
                .where('fromUser').equals(currentUser.username)
                .or('toUser').equals(currentUser.username)
                .toArray();

            const dialogsMap = new Map();

            messages.forEach(msg => {
                const otherUser = msg.fromUser === currentUser.username ? msg.toUser : msg.fromUser;

                if (!dialogsMap.has(otherUser)) {
                    dialogsMap.set(otherUser, {
                        username: otherUser,
                        lastMessage: msg.text,
                        timestamp: msg.timestamp
                    });
                } else {
                    const existing = dialogsMap.get(otherUser);
                    if (msg.timestamp > existing.timestamp) {
                        existing.lastMessage = msg.text;
                        existing.timestamp = msg.timestamp;
                    }
                }
            });

            const dialogs = Array.from(dialogsMap.values())
                .sort((a, b) => b.timestamp - a.timestamp);

            renderDialogs(dialogs);
        }

        // Отрисовка списка диалогов
        function renderDialogs(dialogs) {
            const dialogsList = document.getElementById('dialogsList');
            dialogsList.innerHTML = '';

            dialogs.forEach(dialog => {
                const div = document.createElement('div');
                div.className = 'dialog-item';
                if (activeDialog === dialog.username) {
                    div.classList.add('active');
                }
                div.innerHTML = `
                    <div class="dialog-name">${dialog.username}</div>
                    <div class="dialog-last-message">${dialog.lastMessage}</div>
                `;
                div.onclick = () => openDialog(dialog.username);
                dialogsList.appendChild(div);
            });
        }

        // Поиск пользователей
        async function searchUsers() {
            const query = document.getElementById('searchUsers').value.trim().toLowerCase();

            if (!query) {
                await loadDialogs();
                return;
            }

            const users = await db.users.toArray();
            const dialogUsers = users
                .filter(u => u.username !== currentUser.username && u.username.toLowerCase().includes(query))
                .map(u => ({ username: u.username, lastMessage: 'Начните переписку', timestamp: 0 }));

            renderDialogs(dialogUsers);
        }

        // Открытие диалога
        async function openDialog(username) {
            activeDialog = username;
            document.getElementById('emptyChat').style.display = 'none';
            document.getElementById('activeChat').classList.remove('hidden');
            document.getElementById('activeChatName').textContent = username;

            await loadMessages();
            await loadDialogs();
        }

        // Загрузка сообщений
        async function loadMessages() {
            const messages = await db.messages
                .filter(msg =>
                    (msg.fromUser === currentUser.username && msg.toUser === activeDialog) ||
                    (msg.fromUser === activeDialog && msg.toUser === currentUser.username)
                )
                .toArray();

            messages.sort((a, b) => a.timestamp - b.timestamp);

            const messagesArea = document.getElementById('messagesArea');
            messagesArea.innerHTML = '';

            messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.fromUser === currentUser.username ? 'sent' : 'received'}`;

                const time = new Date(msg.timestamp).toLocaleTimeString('ru-RU', {
                    hour: '2-digit',
                    minute: '2-digit'
                });

                div.innerHTML = `
                    <div class="message-bubble">${msg.text}</div>
                    <div class="message-time">${time}</div>
                `;
                messagesArea.appendChild(div);
            });

            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        // Отправка сообщения
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            if (!text || !activeDialog) return;

            await db.messages.add({
                fromUser: currentUser.username,
                toUser: activeDialog,
                text: text,
                timestamp: Date.now()
            });

            input.value = '';
            await loadMessages();
            await loadDialogs();
        }

        // Обработка Enter для отправки сообщения
        function handleMessageKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // Удаление чата
        async function deleteChat() {
            if (!activeDialog) return;

            const confirmed = confirm('Удалить всю переписку с этим пользователем?');
            if (!confirmed) return;

            // Удаляем все сообщения между текущим пользователем и собеседником
            await db.messages
                .filter(msg =>
                    (msg.fromUser === currentUser.username && msg.toUser === activeDialog) ||
                    (msg.fromUser === activeDialog && msg.toUser === currentUser.username)
                )
                .delete();

            // Очищаем окно переписки
            document.getElementById('messagesArea').innerHTML = '';

            // Закрываем чат
            activeDialog = null;
            document.getElementById('activeChat').classList.add('hidden');
            document.getElementById('emptyChat').style.display = 'flex';

            // Обновляем список диалогов
            await loadDialogs();
        }

        // ===== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ =====

        // Закрыть модальное окно при клике вне окна
        function closeModalOnOverlay(event, modalId) {
            if (event.target.id === modalId) {
                if (modalId === 'profileModal') {
                    closeProfileModal();
                } else if (modalId === 'settingsModal') {
                    closeSettingsModal();
                }
            }
        }

        // ===== ФУНКЦИИ ПРОФИЛЯ =====

        // Открыть свой профиль
        async function openMyProfile() {
            await openUserProfile(currentUser.username, true);
        }

        // Открыть профиль активного собеседника
        async function openActiveUserProfile() {
            if (activeDialog) {
                await openUserProfile(activeDialog, false);
            }
        }

        // Открыть профиль пользователя
        async function openUserProfile(username, isOwnProfile = false) {
            currentProfileUser = username;

            // Показать/скрыть кнопки редактирования
            document.getElementById('changeBannerBtn').style.display = isOwnProfile ? 'flex' : 'none';
            document.getElementById('changeAvatarOverlay').style.display = isOwnProfile ? 'flex' : 'none';
            document.getElementById('profileActions').style.display = isOwnProfile ? 'block' : 'none';

            // Установить обработчик клика на аватар только для своего профиля
            const avatarContainer = document.getElementById('avatarContainer');
            if (isOwnProfile) {
                avatarContainer.style.cursor = 'pointer';
                avatarContainer.onclick = selectAvatar;
            } else {
                avatarContainer.style.cursor = 'default';
                avatarContainer.onclick = null;
            }

            // Загрузить профиль
            await loadProfile(username);

            // Показать модальное окно
            document.getElementById('profileModal').classList.add('active');
        }

        // Загрузить профиль из базы данных
        async function loadProfile(username) {
            document.getElementById('profileUsername').textContent = username;

            const profile = await db.profiles.get(username);

            const bannerImg = document.getElementById('profileBanner');
            const avatarImg = document.getElementById('profileAvatar');

            if (profile) {
                // Загрузить фон
                if (profile.banner) {
                    bannerImg.src = profile.banner;
                    bannerImg.style.display = 'block';
                    bannerImg.style.objectPosition = profile.banner_pos || '50% 50%';
                } else {
                    bannerImg.style.display = 'none';
                }

                // Загрузить аватар
                if (profile.avatar) {
                    avatarImg.src = profile.avatar;
                    avatarImg.style.display = 'block';
                    avatarImg.style.objectPosition = profile.avatar_pos || '50% 50%';
                } else {
                    avatarImg.style.display = 'none';
                }
            } else {
                bannerImg.style.display = 'none';
                avatarImg.style.display = 'none';
            }
        }

        // Закрыть модальное окно профиля
        function closeProfileModal() {
            document.getElementById('profileModal').classList.remove('active');
            currentProfileUser = null;
        }

        // Выбрать аватар
        function selectAvatar() {
            const input = document.getElementById('avatarInput');
            input.value = ''; // Сбросить значение для возможности повторного выбора того же файла
            input.click();
        }

        // Выбрать фон
        function selectBanner() {
            const input = document.getElementById('bannerInput');
            input.value = ''; // Сбросить значение для возможности повторного выбора того же файла
            input.click();
        }

        // Обработать изменение аватара
        async function handleAvatarChange(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                tempAvatar = e.target.result;

                // Обновить аватар в профиле
                const avatarImg = document.getElementById('profileAvatar');
                avatarImg.src = tempAvatar;
                avatarImg.style.display = 'block';

                // Сохранить в базу данных
                await saveProfileImage('avatar', tempAvatar);
            };
            reader.readAsDataURL(file);
        }

        // Обработать изменение фона
        async function handleBannerChange(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                tempBanner = e.target.result;

                // Обновить фон в профиле
                const bannerImg = document.getElementById('profileBanner');
                bannerImg.src = tempBanner;
                bannerImg.style.display = 'block';

                // Сохранить в базу данных
                await saveProfileImage('banner', tempBanner);
            };
            reader.readAsDataURL(file);
        }

        // Сохранить изображение профиля
        async function saveProfileImage(type, data) {
            const profile = await db.profiles.get(currentUser.username) || {
                username: currentUser.username,
                avatar: null,
                banner: null,
                avatar_pos: '50% 50%',
                banner_pos: '50% 50%'
            };

            if (type === 'avatar') {
                profile.avatar = data;
            } else if (type === 'banner') {
                profile.banner = data;
            }

            await db.profiles.put(profile);
        }

        // ===== ФУНКЦИИ НАСТРОЕК =====

        // Открыть настройки
        async function openSettings() {
            const profile = await db.profiles.get(currentUser.username) || {
                avatar_pos: '50% 50%',
                banner_pos: '50% 50%'
            };

            // Загрузить текущие позиции
            const [bannerX, bannerY] = (profile.banner_pos || '50% 50%').split(' ').map(v => parseInt(v));
            const [avatarX, avatarY] = (profile.avatar_pos || '50% 50%').split(' ').map(v => parseInt(v));

            document.getElementById('bannerXSlider').value = bannerX;
            document.getElementById('bannerYSlider').value = bannerY;
            document.getElementById('avatarXSlider').value = avatarX;
            document.getElementById('avatarYSlider').value = avatarY;

            tempBannerPos = profile.banner_pos || '50% 50%';
            tempAvatarPos = profile.avatar_pos || '50% 50%';

            // Обновить превью
            const previewBanner = document.getElementById('previewBanner');
            const previewAvatar = document.getElementById('previewAvatar');
            const profileBanner = document.getElementById('profileBanner');
            const profileAvatar = document.getElementById('profileAvatar');

            if (profileBanner.src && profileBanner.style.display !== 'none') {
                previewBanner.src = profileBanner.src;
                previewBanner.style.display = 'block';
                previewBanner.style.objectPosition = tempBannerPos;
            } else {
                previewBanner.style.display = 'none';
            }

            if (profileAvatar.src && profileAvatar.style.display !== 'none') {
                previewAvatar.src = profileAvatar.src;
                previewAvatar.style.display = 'block';
                previewAvatar.style.objectPosition = tempAvatarPos;
            } else {
                previewAvatar.style.display = 'none';
            }

            updateBannerPosition();
            updateAvatarPosition();

            // Показать модальное окно настроек
            document.getElementById('settingsModal').classList.add('active');
        }

        // Закрыть настройки
        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.remove('active');
        }

        // Обновить позицию фона
        function updateBannerPosition() {
            const x = document.getElementById('bannerXSlider').value;
            const y = document.getElementById('bannerYSlider').value;

            document.getElementById('bannerXValue').textContent = `${x}%`;
            document.getElementById('bannerYValue').textContent = `${y}%`;

            tempBannerPos = `${x}% ${y}%`;

            const previewBanner = document.getElementById('previewBanner');
            if (previewBanner.style.display !== 'none') {
                previewBanner.style.objectPosition = tempBannerPos;
            }
        }

        // Обновить позицию аватара
        function updateAvatarPosition() {
            const x = document.getElementById('avatarXSlider').value;
            const y = document.getElementById('avatarYSlider').value;

            document.getElementById('avatarXValue').textContent = `${x}%`;
            document.getElementById('avatarYValue').textContent = `${y}%`;

            tempAvatarPos = `${x}% ${y}%`;

            const previewAvatar = document.getElementById('previewAvatar');
            if (previewAvatar.style.display !== 'none') {
                previewAvatar.style.objectPosition = tempAvatarPos;
            }
        }

        // Сохранить настройки
        async function saveSettings() {
            const profile = await db.profiles.get(currentUser.username) || {
                username: currentUser.username,
                avatar: null,
                banner: null
            };

            profile.avatar_pos = tempAvatarPos;
            profile.banner_pos = tempBannerPos;

            await db.profiles.put(profile);

            // Применить к текущему профилю
            const profileBanner = document.getElementById('profileBanner');
            const profileAvatar = document.getElementById('profileAvatar');

            if (profileBanner.style.display !== 'none') {
                profileBanner.style.objectPosition = tempBannerPos;
            }

            if (profileAvatar.style.display !== 'none') {
                profileAvatar.style.objectPosition = tempAvatarPos;
            }

            closeSettingsModal();
            alert('Настройки сохранены!');
        }

        // Инициализация тестовых данных
        async function initTestData() {
            const count = await db.users.count();
            if (count === 0) {
                await db.users.bulkAdd([
                    { username: 'alice', password: '123' },
                    { username: 'bob', password: '123' },
                    { username: 'charlie', password: '123' }
                ]);
            }
        }

        // Запуск приложения
        initTestData();
    </script>
</body>
</html>
